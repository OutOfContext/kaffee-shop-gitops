apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata: { name: argocd-application-controller, namespace: argocd }
spec:
  selector: { matchLabels: { app.kubernetes.io/name: argocd-metrics } }
  endpoints: [ { port: metrics } ]
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata: { name: argocd-server, namespace: argocd }
spec:
  selector: { matchLabels: { app.kubernetes.io/name: argocd-server-metrics } }
  endpoints: [ { port: metrics } ]
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata: { name: argocd-repo-server, namespace: argocd }
spec:
  selector: { matchLabels: { app.kubernetes.io/name: argocd-repo-server } }
  endpoints: [ { port: metrics } ]
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata: { name: argocd-applicationset-controller, namespace: argocd }
spec:
  selector: { matchLabels: { app.kubernetes.io/name: argocd-applicationset-controller } }
  endpoints: [ { port: metrics } ]
