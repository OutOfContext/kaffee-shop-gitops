apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "kaffee-shop.name" . }}-html
data:
  index.html: |
    <!doctype html><html lang="de"><head><meta charset="utf-8"><title>Nordlicht Kaffee</title>
    <style>body{font-family:system-ui;background:#1b1410;color:#f3e9dc;display:grid;place-items:center;height:100vh;margin:0}
    h1{font-size:3rem;margin:0}p{color:#c9a37a}.v{font-family:monospace;background:#2a1f18;padding:.3rem .6rem;border-radius:6px}</style></head>
    <body><div style="text-align:center"><h1>☕ Tschibo Kaffee</h1><p>Wenn teuer, dann gut.</p>
    <p>Version: <span class="v">{{ .Chart.AppVersion }}</span> &nbsp; Umgebung: <span class="v">{{ .Values.environment }}</span></p></div></body></html>
