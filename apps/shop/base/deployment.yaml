apiVersion: apps/v1
kind: Deployment
metadata:
  name: kaffee-shop
  labels:
    app.kubernetes.io/name: kaffee-shop
    app.kubernetes.io/part-of: nordlicht
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kaffee-shop
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kaffee-shop
    spec:
      containers:
        - name: web
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: html
              mountPath: /usr/share/nginx/html
          resources:
            requests: { cpu: 20m, memory: 32Mi }
            limits:   { cpu: 200m, memory: 64Mi }
          readinessProbe:
            httpGet: { path: /, port: 80 }
            initialDelaySeconds: 2
      volumes:
        - name: html
          configMap:
            name: kaffee-shop-html
