apiVersion: batch/v1
kind: Job
metadata:
  name: smoketest
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: curl
          image: curlimages/curl:8.10.1
          command: ["sh", "-c", "sleep 3; curl -fsS http://kaffee-shop.shop-hooks.svc/ | grep -q Nordlicht && echo 'Smoketest OK'"]
